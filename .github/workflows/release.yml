name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Decode release keystore
        env: { KEYSTORE_B64: '${{ secrets.PIXEL_GBA_KEYSTORE_B64 }}' }
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Set PIXEL_GBA_KEYSTORE_B64 before publishing OTA releases' && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > pixel-gba-release.jks
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PIXEL_GBA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PIXEL_GBA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PIXEL_GBA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PpixelGbaKeystore=pixel-gba-release.jks -PpixelGbaStorePassword="$KEYSTORE_PASSWORD" -PpixelGbaKeyAlias="$KEY_ALIAS" -PpixelGbaKeyPassword="$KEY_PASSWORD"
      - name: Name release APK
        run: cp app/build/outputs/apk/release/app-release.apk "PixelGBA-${GITHUB_REF_NAME#v}.apk"
      - name: Publish GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${GITHUB_REF_NAME}" "PixelGBA-${GITHUB_REF_NAME#v}.apk" --title "Pixel GBA ${GITHUB_REF_NAME#v}" --generate-notes
